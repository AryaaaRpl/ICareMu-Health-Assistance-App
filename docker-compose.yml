services:
  # 1. NGINX (Web Server & Reverse Proxy)
  web:
    image: nginx:alpine
    container_name: icaremu_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - icaremu_network

  # 2. PHP-FPM (Laravel App Engine)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icaremu_app
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
    networks:
      - icaremu_network

  # 3. POSTGRESQL (The Lumba-Lumba Database)
  db:
    image: postgres:15-alpine
    container_name: icaremu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icaremu_local
      POSTGRES_USER: icaremu
      POSTGRES_PASSWORD: icaremu2026
    ports:
      - "5432:5432"
    volumes:
      - icaremu_pgdata:/var/lib/postgresql/data
    networks:
      - icaremu_network

  # 4. REDIS (Caching & Session Store)
  redis:
    image: redis:7-alpine
    container_name: icaremu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - icaremu_redisdata:/data
    networks:
      - icaremu_network

volumes:
  icaremu_pgdata:
  icaremu_redisdata:

networks:
  icaremu_network:
    driver: bridge
